<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  :root{--bg:#FFF8F0;--t1:#2D2016;--t2:#8C7B6B;--t3:#B5A899;--accent:#5B8C6A;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{width:1000px;height:430px;background:#E7E0D6;
    font-family:-apple-system,"Apple SD Gothic Neo","Helvetica Neue",sans-serif;color:var(--t1);}
  .page{display:flex;gap:26px;padding:30px 28px;justify-content:center;}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:13px;}
  .cap{font-size:14px;font-weight:700;color:#6f655a;text-align:center;}
  .hl{width:100%;background:#EAF1E4;border:1px solid #D5E3CC;border-radius:18px;padding:18px 18px;}
  .hlTitle{font-size:16px;font-weight:800;}
  .hlDesc{font-size:12px;color:var(--t2);margin-top:5px;line-height:1.35;}
  .dotrow{display:flex;align-items:center;gap:11px;margin-top:16px;}
  .solid{width:17px;height:17px;border-radius:9px;background:var(--accent);}
  .pw{display:flex;flex-direction:column;align-items:center;margin:0 5px;}
  .pause{width:19px;height:19px;border-radius:10px;background:var(--bg);}
  .pLbl{font-size:9px;font-weight:700;margin-top:3px;}
  .legend{font-size:11px;color:var(--t3);margin-top:13px;}
</style>
</head>
<body>
  <div class="page">

    <div class="col">
      <div class="hl">
        <div class="hlTitle">🌊 하루 쉬어도 괜찮아요</div>
        <div class="hlDesc">하루 빠져도 흐름은 이어져요.</div>
        <div class="dotrow">
          <span class="solid"></span><span class="solid"></span>
          <span class="pw"><span class="pause" style="border:3px solid #5B8C6A"></span><span class="pLbl" style="color:#5B8C6A">쉼</span></span>
          <span class="solid"></span><span class="solid"></span><span class="solid"></span>
        </div>
        <div class="legend">○ = 쉼표 (흐름 유지)</div>
      </div>
      <div class="cap">A. 같은 올리브<br>(일관·차분, 모양으로 구분)</div>
    </div>

    <div class="col">
      <div class="hl">
        <div class="hlTitle">🌊 하루 쉬어도 괜찮아요</div>
        <div class="hlDesc">하루 빠져도 흐름은 이어져요.</div>
        <div class="dotrow">
          <span class="solid"></span><span class="solid"></span>
          <span class="pw"><span class="pause" style="border:3px solid #C2A86B"></span><span class="pLbl" style="color:#A8893F">쉼</span></span>
          <span class="solid"></span><span class="solid"></span><span class="solid"></span>
        </div>
        <div class="legend">○ = 쉼표 (흐름 유지)</div>
      </div>
      <div class="cap">B. 웜 샌드/골드<br>(따뜻·휴식 느낌, 크림 조화)</div>
    </div>

    <div class="col">
      <div class="hl">
        <div class="hlTitle">🌊 하루 쉬어도 괜찮아요</div>
        <div class="hlDesc">하루 빠져도 흐름은 이어져요.</div>
        <div class="dotrow">
          <span class="solid"></span><span class="solid"></span>
          <span class="pw"><span class="pause" style="border:3px solid #6B8FB5"></span><span class="pLbl" style="color:#5E80A6">쉼</span></span>
          <span class="solid"></span><span class="solid"></span><span class="solid"></span>
        </div>
        <div class="legend">○ = 쉼표 (흐름 유지)</div>
      </div>
      <div class="cap">C. 소프트 블루<br>(🌊 물결·쉼, 단 다크에서 액센트와 겹침)</div>
    </div>

  </div>
</body>
</html>
