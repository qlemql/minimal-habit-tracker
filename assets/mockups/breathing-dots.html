<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  :root{--bg:#FFF8F0;--t1:#2D2016;--t2:#8C7B6B;--t3:#B5A899;--accent:#5B8C6A;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{width:900px;height:460px;background:#E7E0D6;
    font-family:-apple-system,"Apple SD Gothic Neo","Helvetica Neue",sans-serif;color:var(--t1);}
  .page{display:flex;gap:40px;padding:34px 36px;justify-content:center;}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .cap{font-size:15px;font-weight:700;color:#6f655a;}
  /* breathing highlight card (cream theme) */
  .hl{width:100%;background:#EAF1E4;border:1px solid #D5E3CC;border-radius:18px;padding:20px 22px;}
  .hlTitle{font-size:18px;font-weight:800;}
  .hlDesc{font-size:13.5px;color:var(--t2);margin-top:6px;line-height:1.4;}
  .row{display:flex;align-items:center;margin-top:18px;}
  /* current: glyph */
  .glyph{font-size:22px;color:var(--accent);letter-spacing:6px;}
  /* improved: view dots */
  .dotrow{display:flex;align-items:center;gap:12px;}
  .solid{width:18px;height:18px;border-radius:9px;background:var(--accent);}
  .pauseWrap{display:flex;flex-direction:column;align-items:center;margin:0 6px;}
  .pause{width:20px;height:20px;border-radius:10px;background:var(--bg);
    border:3px solid var(--accent);}
  .pauseLbl{font-size:9px;color:var(--accent);font-weight:700;margin-top:3px;}
  .legend{font-size:11.5px;color:var(--t3);margin-top:14px;}
</style>
</head>
<body>
  <div class="page">

    <div class="col">
      <div class="hl">
        <div class="hlTitle">🌊 하루 쉬어도 괜찮아요</div>
        <div class="hlDesc">하루 빠져도 흐름은 이어져요. 이틀 연속 빠지면 새 시작.</div>
        <div class="row"><span class="glyph">● ● ◌ ● ● ●</span></div>
        <div class="legend">◌ = 쉼표 (흐름 유지)</div>
      </div>
      <div class="cap">현재 — ◌ 글리프 (크림에서 흐릿)</div>
    </div>

    <div class="col">
      <div class="hl">
        <div class="hlTitle">🌊 하루 쉬어도 괜찮아요</div>
        <div class="hlDesc">하루 빠져도 흐름은 이어져요. 이틀 연속 빠지면 새 시작.</div>
        <div class="row">
          <div class="dotrow">
            <span class="solid"></span><span class="solid"></span>
            <span class="pauseWrap"><span class="pause"></span><span class="pauseLbl">쉼</span></span>
            <span class="solid"></span><span class="solid"></span><span class="solid"></span>
          </div>
        </div>
        <div class="legend">○ = 쉼표 (흐름 유지)</div>
      </div>
      <div class="cap">개선 — 도넛 링 + "쉼" 라벨 + 여백</div>
    </div>

  </div>
</body>
</html>
